name: Code Quality Check, Test and Build
description: Runs linting, formatting checks, typecheck, tests, and build for viasport-sdk-ts
runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Run lint
      run: npm run lint
      shell: bash

    - name: Run prettier
      run: npm run prettier
      shell: bash

    - name: Run typecheck
      run: npm run typecheck
      shell: bash

    - name: Run tests
      run: npm test
      shell: bash

    - name: Build
      run: npm run build
      shell: bash
