components:
  schemas:
    Article:
      type: object
      description: Article returned in search and retrieval responses.
      properties:
        authors:
          type: array
          description: Authors credited for this article.
          items:
            $ref: "#/components/schemas/Author"
        availabilityRegions:
          type: array
          description: Regions where the article is available
          items:
            type: string
        contentType:
          type: string
          description: "One of: `sports`, `entertainment`."
          enum:
            - entertainment
            - sports
        createdAt:
          type: string
          format: date-time
          description: RFC 3339 UTC datetime when the article was created
          example: "2026-04-19T07:36:03Z"
        embedUrl:
          type: string
          format: uri
          description: Viaplay player embed URL for this article
          example: "https://embed.viaplay.com/sport/863219a3-0a50-4c26-89dc-4834b62be3f1?partnerId=abc&showtitle=false&postplay=off"
        id:
          type: string
          format: uuid
          description: UUID of the article
          example: 863219a3-0a50-4c26-89dc-4834b62be3f1
        language:
          type: string
          description: "ISO language code. One of: `sv`, `da`, `fi`, `nl`, `no`"
          example: da
        pictures:
          type: array
          description: Picture assets attached to this article.
          items:
            $ref: "#/components/schemas/Picture"
        preamble:
          type: string
          description: Short lead paragraph shown above the body.
          example: Werder-profilen leverede en mål-assist-perle.
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
          description: RFC 3339 UTC datetime when the article is/was published
          example: "2026-04-19T07:36:02Z"
        shortTitle:
          type: string
          description: Short headline for feed/ticker/push surfaces. Falls back to title when absent.
          example: Stage flyver for Werder
        slug:
          type: string
          description: URL-friendly unique identifier
          example: vilde-stage-gor-det-onde-ved-hsv
        tags:
          $ref: "#/components/schemas/Taxonomy"
          description: Structured taxonomy tags.
        text:
          type: string
          description: Main body text of the article
          example: Den tidligere superligaprofil Jens Stage var…
        title:
          type: string
          description: Headline of the article
          example: Vilde Stage gør det onde ved HSV
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339 UTC datetime when the article was last updated
          example: "2026-04-19T07:36:40Z"
        videos:
          type: array
          description: Video assets attached to this article.
          items:
            $ref: "#/components/schemas/Video"
      required:
        - videos
        - availabilityRegions
        - tags
        - id
        - contentType
        - slug
        - title
        - text
        - createdAt
        - language
    ArticleCollection:
      type: object
      description: "HAL response data fields (from GetMap):"
    AuthenticationResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token.
          example: ARmBwHc14lo7Mxnin9UADcfJi5AnXbI7zANVpEfUQRmkvR6gCQxNKE7qBM5cpytnW1BU6IepZ8mAVMxoiJSDBjncASqhTkrJ0Usi_HZ231wTOvQrIj1MBdJvrsAyuBw0Anecn0bpLYemtFiUWfRgegGE6pigrpjdyaK5TkCxxINP9FRe
        accessTokenExpiryEpochSeconds:
          type: integer
          description: Expiry epoch seconds of the access token.
          example: 1710327485
        refreshToken:
          type: string
          description: Refresh token.
          example: ASoJevAkFSYtqLxr4P7gan3l8KiAKbKBtTiXH7xKlp2Wu1O5T1AKeQI5HUMDvlWl_nx1oT_L_LgPHeYxcJx_4h_wAKvWVO_Qs9Gq3GRnp34IIl-Q-Cc4BLxVGfjNVlGnn3vcnkxsvOsLQwfhw9A130uCiiH2Lpl9JN1dAYC1MRZESxzb
      required:
        - accessToken
        - accessTokenExpiryEpochSeconds
        - refreshToken
    Author:
      type: object
      description: list of authors credited for this article.
      properties:
        email:
          type: string
          format: email
          description: "author's email address"
          example: "fabrizio.romano@corriere.it"
        name:
          type: string
          description: "author's full name"
          example: Fabrizio Romano
      required:
        - email
        - name
    EntertainmentTags:
      type: object
      properties:
        episode:
          $ref: "#/components/schemas/TranslationTags"
          description: Episode info.
        format:
          $ref: "#/components/schemas/TranslationTags"
          description: Show/format info.
        seasons:
          type: string
          description: "Season identifier (a single string, not an array)."
          example: season-03
      required:
        - seasons
        - episode
        - format
    ErrBadRequest:
      type: object
      properties:
        error:
          type: object
          properties:
            errCode:
              type: string
              description: Machine-readable error code.
              example: invalid_request
            message:
              type: string
              description: Human-readable error description.
              example: The request body or query parameters seem to be malformed
          required:
            - errCode
            - message
      required:
        - error
    ErrForbidden:
      type: object
      properties:
        error:
          type: object
          properties:
            errCode:
              type: string
              description: Machine-readable error code.
              example: authentication_required
            message:
              type: string
              description: Human-readable error description.
              example: "You don't have enough permissions to access this resource"
          required:
            - errCode
            - message
      required:
        - error
    ErrInternal:
      type: object
      properties:
        error:
          type: object
          properties:
            errCode:
              type: string
              description: Machine-readable error code.
              example: internal_server_error
            message:
              type: string
              description: Human-readable error description.
              example: "Woops! Something went wrong"
          required:
            - errCode
            - message
      required:
        - error
    ErrNotFound:
      type: object
      properties:
        error:
          type: object
          properties:
            errCode:
              type: string
              description: Machine-readable error code.
              example: resource_not_found
            message:
              type: string
              description: Human-readable error description.
              example: Resource not found
          required:
            - errCode
            - message
      required:
        - error
    ErrUnAuthorized:
      type: object
      properties:
        error:
          type: object
          properties:
            errCode:
              type: string
              description: Machine-readable error code.
              example: authentication_required
            message:
              type: string
              description: Human-readable error description.
              example: This resource requires authentication
          required:
            - errCode
            - message
      required:
        - error
    ErrUserAuthenticationFailed:
      type: object
      properties:
        count:
          type: integer
          example: 1
        errCode:
          type: string
          example: user_authentication_failed
        message:
          type: string
          example: The user or password are not valid
        statusCode:
          type: integer
          example: 401
      required:
        - count
        - errCode
        - message
        - statusCode
    ErrValidation:
      type: object
      properties:
        error:
          type: object
          properties:
            details:
              type: array
              description: Per-field validation errors. Present only on 422 responses.
              items:
                type: object
            errCode:
              type: string
              description: Machine-readable error code.
              example: validation_failed
            message:
              type: string
              description: Human-readable error description.
              example: Validation failed
          required:
            - errCode
            - message
      required:
        - error
    PartnerAvailability:
      type: object
      properties:
        availableFrom:
          type: string
        availableTo:
          type: string
        partnerId:
          type: string
      required:
        - partnerId
    Picture:
      type: object
      properties:
        mediaGuid:
          type: string
          description: picture media-guid
          example: 7Xasd9ea0Wsk9wpasdlsd0owlasd0
        pictureText:
          type: string
          description: picture text description of the image
          example: An example image
        url:
          type: string
          format: uri
          description: picture URL of the image
          example: "https://example.com/image.jpg"
      required:
        - url
    Poster:
      type: object
      properties:
        large:
          type: string
          format: uri
          description: large variation of the poster
          example: "https://example.com/poster_large.jpg"
        medium:
          type: string
          format: uri
          description: medium variation of the poster
          example: "https://example.com/poster_medium.jpg"
        small:
          type: string
          format: uri
          description: small variation of the poster
          example: "https://example.com/poster_small.jpg"
      required:
        - small
        - medium
        - large
    SportTags:
      type: object
      properties:
        competitions:
          type: array
          description: Primary competition(s) for the article.
          items:
            $ref: "#/components/schemas/TranslationTags"
        participants:
          type: string
          description: "mahle (array[string], required) - Participant IDs or names (free-form strings, not translation objects)."
          example: joakim
        sports:
          type: array
          description: Primary sport(s) for the article.
          items:
            $ref: "#/components/schemas/TranslationTags"
        teams:
          type: array
          description: Teams covered by the article.
          items:
            $ref: "#/components/schemas/TranslationTags"
        videoTypes:
          type: array
          description: Types of sport-related videos.
          items:
            type: string
      required:
        - sports
        - competitions
        - teams
        - videoTypes
    StatusError:
      type: object
      properties:
        errCode:
          type: string
          enum:
            - authentication_required
            - resource_not_found
            - invalid_request
            - validation_failed
            - resource_conflict
            - user_authentication_failed
            - api_authentication_failed
            - internal_server_error
        message:
          type: string
      required:
        - errCode
        - message
    Taxonomy:
      type: object
      oneOf:
        - type: object
          properties:
            sport:
              $ref: "#/components/schemas/SportTags"
              description: "Sport-specific tags. Populated when `contentType` is `sports`; serialised as an empty object otherwise. Branch on `contentType` rather than field presence."
          required:
            - sport
        - type: object
          properties:
            entertainment:
              $ref: "#/components/schemas/EntertainmentTags"
              description: "Entertainment-specific tags. Omitted from responses when zero-valued; populated only when `contentType` is `entertainment`."
      properties:
        contents:
          type: array
          description: Content category labels.
          items:
            type: string
        freeTexts:
          type: array
          description: Free-text tags. Always present in responses (may be empty).
          items:
            type: string
      required:
        - freeTexts
    TranslationTags:
      type: object
      properties:
        id:
          type: string
          description: Internal stable ID (slug-like).
          example: football
        optaId:
          type: string
          description: "External Opta ID, when one was supplied via the legacy `\"opta\"` locale. Opaque upstream identifier — do not assume any particular shape."
          example: 34oqloyzlx0btgmhmzc4d8frl
        translations:
          type: object
          description: Flat map of ISO 639-1 language code → translated display name. Only languages that have a translation are present as keys.
          properties:
            da:
              type: string
              description: sample
              example: Fodbold
            "no":
              type: string
              description: sample
              example: Fotball
            sv:
              type: string
              description: sample
              example: Fotboll
      required:
        - id
        - translations
    ValidationErrMsg:
      type: object
      properties:
        code:
          type: string
          enum:
            - required
            - invalid_enum_value
            - invalid_url
            - invalid_ulid
            - invalid_uuid
            - invalid_email
            - must_match_discriminator
            - invalid_sort_field
            - invalid
        message:
          type: string
        path:
          type: string
      required:
        - path
        - code
        - message
    Video:
      type: object
      properties:
        horizontal:
          description: Horizontal (landscape) video variant. Present only when a horizontal asset is available.
          oneOf:
            - $ref: "#/components/schemas/VideoVariant"
            - type: "null"
        id:
          type: string
          description: "video unique identifier for the logical video,"
          example: 01F8MECHZX3TBDSZ7XRADM79XE
        vertical:
          description: Vertical (portrait) video variant. Present only when a vertical asset is available.
          oneOf:
            - $ref: "#/components/schemas/VideoVariant"
            - type: "null"
      required:
        - id
    VideoVariant:
      type: object
      properties:
        duration:
          type: number
          description: video duration in seconds
          example: 120.5
        filename:
          type: string
          description: video filename
          example: example_video.mp4
        format:
          type: string
          description: "video format one of `mp4` `webm` `ogg`"
          example: mp4
        mediaGuid:
          type: string
          description: mpx media-guid
          example: 4rxTeMBE8rjk9XVG06AqwrCtYYFRwaCy
        posterUrls:
          $ref: "#/components/schemas/Poster"
          description: "video posterUrls object containing URLs for small, medium, and large poster images associated with the video variant"
      required:
        - mediaGuid
  securitySchemes:
    BearerAuth:
      type: http
      description: "Authentication via JWT bearer token. Include the token in the `Authorization` header prefixed with `Bearer `."
      scheme: bearer
      bearerFormat: JWT
